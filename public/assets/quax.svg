<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Квакс">
  <defs>
    <linearGradient id="quax-bg" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2136"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="quax-accent" x1="20" y1="22" x2="46" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Корпус токена: тот же контур, что у пропуска КОНТУРа -->
  <path d="M32 3.5 56.5 17.5v29L32 60.5 7.5 46.5v-29Z" fill="url(#quax-bg)" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 9 51.5 20v24L32 55 12.5 44V20Z" fill="none" stroke="#164e63" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Верхняя градиентная полоса — как магнитная полоса пропуска -->
  <path d="M24 11.5h16" stroke="url(#quax-accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Центральный кристалл: нейтральный знак валюты -->
  <path d="M32 18 46 32 32 46 18 32Z" fill="#0b3b4a" stroke="url(#quax-accent)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 23 41 32 32 41 23 32Z" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 28.5 35.5 32 32 35.5 28.5 32Z" fill="#5eead4"/>

  <!-- Контурные дорожки и узлы -->
