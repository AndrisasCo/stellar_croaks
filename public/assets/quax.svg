  <circle cx="15" cy="32" r="1.3" fill="#a5f3fc"/>
  <circle cx="49" cy="32" r="1.3" fill="#a5f3fc"/>

  <!-- Технические насечки -->
  <path d="M27 49h10M29.5 52h5" stroke="#155e75" stroke-width="1.5" stroke-linecap="round"/>
</svg>
